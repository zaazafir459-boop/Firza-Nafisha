<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — Velora</title><link rel="stylesheet" href="css/style.css"></head><body><header><a class="brand" href="index.html"><i>V</i>VELORA</a><nav><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a href="index.html#categories">Categories</a><a href="seller.html">Sell</a></nav><div class="actions"><a href="cart.html">🛒<sup id="count">0</sup></a><a class="pill dark" href="login.html">Sign in</a></div></header><main class="shop"><div class="shop-title"><span class="tag">ALL PRODUCTS</span><h1>Find something<br><i>worth keeping.</i></h1></div><div class="filters"><input id="q" placeholder="Search products..."><select id="cat"><option value="">All categories</option><option>Fashion</option><option>Tech</option><option>Home</option><option>Hobby</option></select><select id="sort"><option>Featured</option><option value="low">Lowest price</option><option value="high">Highest price</option></select></div><div id="grid" class="grid"></div></main><script src="js/data.js"></script><script src="js/app.js"></script><script>const p=new URLSearchParams(location.search);if(p.get('cat'))cat.value=p.get('cat');function render(){let a=products.filter(x=>(!q.value||x.name.toLowerCase().includes(q.value.toLowerCase()))&&(!cat.value||x.category===cat.value));if(sort.value==='low')a.sort((x,y)=>x.price-y.price);if(sort.value==='high')a.sort((x,y)=>y.price-x.price);grid.innerHTML=a.map(card).join('')||'<p class="empty">No products found.</p>'}q.oninput=cat.onchange=sort.onchange=render;render()</script></body></html>
