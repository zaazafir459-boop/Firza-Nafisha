<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Velora</title><link rel="stylesheet" href="css/style.css"></head><body><header><a class="brand" href="index.html"><i>V</i>VELORA</a><nav><a href="shop.html">Shop</a></nav><div class="actions"><a href="cart.html">🛒<sup id="count">0</sup></a></div></header><main class="detail" id="detail"></main><script src="js/data.js"></script><script src="js/app.js"></script><script>let id=+new URLSearchParams(location.search).get('id')||1,p=products.find(x=>x.id===id)||products[0];detail.innerHTML=`<div class="detail-img">${p.emoji}</div><div><span class="tag">${p.category}</span><h1>${p.name}</h1><div class="rating">★ ${p.rating} · ${p.sold} sold</div><h2>Rp ${fmt(p.price)}</h2><p>${p.desc}</p><p>📍 ${p.city} · ✓ Verified seller</p><button class="pill dark" onclick="add(${p.id})">Add to cart</button> <a class="pill" href="cart.html">View cart</a></div>`</script></body></html>
